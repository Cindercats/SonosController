; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; TJpg_Decoder was removed: its jd_prepare/jd_decomp symbols collide with the
; ones ESP-IDF's esp_jpg_decode defines internally, crashing the decode.
;
; Artwork decoding is split by JPEG type:
;   baseline    -> esp_jpg_decode()  (ESP-IDF ROM TJpgDec, streams from LittleFS)
;   progressive -> JPEGDEC            (bitbank2, the only one of the two that
;                                      supports SOF2 / progressive scans)
;
; esp_jpg_decode is BASELINE ONLY: it wraps the ROM TJpgDec core, whose jd_prepare()
; returns JDR_FMT3 for a progressive frame, which surfaces as ESP_FAIL. Sonos serves
; progressive artwork for local library tracks, hence the second decoder.
; See README.md section 6 and ARTWORK-ATTEMPTS.md for the full history.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/JPEGDEC @ ^1.2.2

; Auto-increments APP_VERSION in src/main.cpp by 0.01 before each build.
extra_scripts = pre:version_bump.py


build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
